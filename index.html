<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조종환 회계사</title>
<meta name="description" content="조종환 회계사의 실무 기록 — 스타트업·국제조세, 부동산·정비사업, 시사 관련 글을 씁니다.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>조종환</h1>
    <p class="role">회계사</p>
    <div class="tracks">
      <span class="tax">스타트업 · 국제조세</span>
      <span class="estate">부동산 · 정비사업</span>
      <span class="news">시사</span>
    </div>
  </header>

  <main>
    <h2 class="section">글</h2>
    <ul class="post-list" id="post-list">
      <!-- 글이 게시되면 여기에 하나씩 추가됩니다 -->
    </ul>
    <div class="empty-state" id="empty-state">
      아직 게시된 글이 없습니다. 첫 글이 올라오면 이곳에서도 함께 볼 수 있습니다.
    </div>
  </main>

  <footer class="site">
    <span>&copy; 2026 조종환</span>
  </footer>
</div>
</body>
</html>
